# FTA 要因生成プロンプト設定ファイル
#
# 使用可能な変数（{variable} 形式でテンプレート内に記述）:
#   {level}            - 階層名（例: 一次要因（大分類）、二次要因（一次要因の具体化））
#   {top_event}        - 頂上事象
#   {parent_factor}    - 親要因名（一次要因生成の場合は頂上事象と同じ）
#   {path_str}         - 要因パス（例: 頂上事象 > 一次要因名）
#   {desired_count}    - 生成件数（.env の FTA_*_FACTOR_COUNT で設定）
#   {min_count}        - 最低件数（desired_count - 1）
#   {existing_section} - 既存要因リスト（追加生成時のみ挿入。空の場合は空文字）
#
# 注意:
#   - JSONの例示 {"key": "value"} はテンプレート変数と干渉しません（{" で始まる記法は変換されない）
#   - ファイルを変更した場合は uvicorn を再起動してください

factor_generation:

  system: |
    あなたはFTA（Fault Tree Analysis：故障の木解析）分析の専門家です。
    必ず日本語で回答してください。
    指示に従い、指定されたJSONスキーマ形式のみで回答してください。
    JSON以外の説明文・Markdown・コードブロックは一切出力しないでください。

  user: |
    以下の「親要因」の直接原因となる子要因を必ず{desired_count}件、日本語で出力してください。
    目標件数は{desired_count}件です。{min_count}件は最低許容件数であり、{min_count}件を最初から目標にしてはいけません。
    下記の出力例は2件ですが、例の件数ではなく必ず{desired_count}件を生成してください。

    【分析情報】
    頂上事象: {top_event}
    親要因: {parent_factor}
    要因パス: {path_str}
    階層: {level}
    {existing_section}
    【子要因の品質要件（必ず守ること）】
    - 親要因の「直接原因」のみを出す（間接原因・抽象概念・推測は禁止）
    - 親要因よりも必ず具体化された内容にする（抽象度を上げない）
    - 現場で「はい/いいえ」で確認できる粒度にする
    - 親要因の言い換えや、語尾だけを変えた表現は禁止
    - 同じ意味の要因を複数出すことは禁止

    【nameに禁止する内容】
    - 「原因」「要因」「問題」「不備」「障害」「エラー」「失敗」「その他」だけの名前
    - 親要因と同じ名前、または語尾だけを変えた名前
    - 単語1つだけの抽象的な名前（例：「不整合」「遅延」「不足」）
    - 「〜が原因である」「〜が問題である」のように、確認観点がない表現

    【良い要因名の例（具体的で確認可能な粒度）】
    - 設定変更の反映漏れ
    - 冗長構成の切替失敗
    - 依存サービスの応答遅延
    - リソース使用率の上限到達
    - 認証・認可処理の失敗
    - 名前解決の失敗
    - バージョン差異による不整合
    - 証明書・有効期限の管理漏れ
    - 監視アラートの検知遅延
    - 変更作業の影響確認不足

    【参考観点（必要なものだけ使うこと）】
    構成・設定 / ソフトウェア・バージョン / ハードウェア・リソース / ネットワーク・通信経路
    認証・権限 / 名前解決 / 外部サービス・依存 / 監視・検知
    運用手順・変更管理 / 復旧対応・判断 / ログ・調査 / キャパシティ・性能
    冗長化・切替 / セキュリティ設定 / 証明書・期限管理

    【出力形式（必ず守ること）】
    - 必ず日本語で出力する（英語禁止）
    - JSONオブジェクトのみ出力する（前置き・補足・説明文・Markdown禁止）
    - nameは30文字以内を目安にする
    - descriptionは現場で確認できる観点を80文字以内を目安に記述する
    - confidence: "high"=直接原因の可能性が高い / "medium"=可能性あり / "low"=念のため確認

    {"factors": [
      {"name": "設定変更の反映漏れ", "description": "直近の設定変更が全ノードに反映されているか変更履歴で確認する", "confidence": "high"},
      {"name": "冗長構成の切替失敗", "description": "フェイルオーバー発生時に切替が正常に完了したかログで確認する", "confidence": "medium"}
    ]}
