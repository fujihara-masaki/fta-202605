# FTA 要因生成プロンプト設定ファイル
#
# 使用可能な変数（{variable} 形式でテンプレート内に記述）:
#   {level}              - 階層名（例: 一次要因（大分類）、二次要因（一次要因の具体化））
#   {top_event}          - 頂上事象
#   {parent_factor}      - 親要因名（一次要因生成の場合は頂上事象と同じ）
#   {parent_description} - 親要因の説明（空の場合は「（説明なし）」）
#   {ancestor_factors}   - 要因パス上の祖先要因一覧（空の場合は「（なし）」）
#   {no_rated_section}   - ユーザがNo評価した要因一覧（空の場合は空文字）
#   {path_str}           - 要因パス（例: 頂上事象 > 一次要因名）
#   {desired_count}      - 生成件数（.env の FTA_*_FACTOR_COUNT で設定）
#   {min_count}          - 最低件数（desired_count - 1）
#   {existing_section}   - 既存要因リスト（追加生成時のみ挿入。空の場合は空文字）
#   {analysis_context_section} - サンプルシナリオ由来の分析コンテキスト
#                                 （システム構成・障害情報・デモ観点。空の場合は空文字）
#
# 注意:
#   - JSONの例示 {"key": "value"} はテンプレート変数と干渉しません（{" で始まる記法は変換されない）
#   - ファイルを変更した場合は uvicorn を再起動してください
#   - 最終プロンプトをログ出力するには FTA_DEBUG_PROMPT=true を .env に追加してください

factor_generation:

  system: |
    あなたはFTA（Fault Tree Analysis：故障の木解析）分析の専門家です。
    必ず日本語で回答してください。
    指示に従い、指定されたJSONスキーマ形式のみで回答してください。
    JSON以外の説明文・Markdown・コードブロックは一切出力しないでください。

  user: |
    以下の「親要因」の直接原因となる子要因を{desired_count}件（最低{min_count}件）を目標に日本語で出力してください。
    ただし、言い換え・逆因果・祖先への逆戻り・抽象的な候補で水増ししてはいけません。

    【分析情報】
    頂上事象: {top_event}
    要因パス: {path_str}
    階層: {level}
    親要因: {parent_factor}
    親要因の説明: {parent_description}
    祖先要因一覧: {ancestor_factors}
    {existing_section}{no_rated_section}{analysis_context_section}
    【直接原因の判定ルール（最重要・必ず守ること）】
    1. 子要因Xは「Xが発生したため、親要因Yが発生した」と自然に説明できるものだけにする
    2. 「親要因Yが発生したため、Xが発生した」の方が自然な場合は因果の向きが逆 → 出力禁止
    3. 親要因の言い換え・同義語・語尾の変更は出力しない
    4. 親要因の結果・影響・検知後の対応は直接原因ではない → 出力禁止
    5. 祖先要因一覧と同じ名前・同義語・上位概念に戻る候補は出力しない
    6. 親要因より抽象度が上がる要因は出力しない
    7. 直接原因として妥当でない候補で件数を水増ししない
    8. 対象サービス・対象機器・監視・確認・接続などの観点自体は禁止しない
    9. 調査観点・対策・確認作業そのものを子要因にしない（子要因は「なぜ親要因が発生したか」に答える原因であること）
    10. 分析コンテキスト（システム構成・障害情報）は参考情報であり、現在の親要因と因果関係がある場合のみ使用する。親要因と別系統の構成要素を、因果の根拠なく子要因に混ぜない
    11. 子要因は親要因と同じ系統（DNS系・認証基盤系・ファイアウォール系・経路系など）の中で深掘りする。別系統の要因は子要因にせず、一次要因として扱うべき候補なので出力しない

    【系統の一貫性（最重要・親子関係を自然にするため）】
    子要因は、必ず「なぜ現在の親要因が発生したのか」に答える、親要因と同じ系統の直接原因にすること。
    親要因がどの系統（構成要素）に属するかをまず内部的に判定し、その系統の中だけを深掘りする。

    - 親要因がDNS系（例: DNS設定の誤り、名前解決の失敗）
      → DNS設定値の誤り、DNSサーバ指定の誤り、DNS設定配布の失敗、DNSレコードの不整合 など
        DNSに直接関係する原因のみを出力する
    - 親要因が認証基盤系（例: 認証基盤の負荷状況、認証エラー）
      → 認証基盤のリソース不足、認証リクエスト集中、認証処理のタイムアウト設定、
        認証基盤の冗長構成不備 など、認証基盤に直接関係する原因のみを出力する
    - 親要因がファイアウォール系（例: ファイアウォールルールの制限）
      → ファイアウォールルールの設定誤り、ルール適用順序の誤り、許可ルールの不足、
        ルール変更の反映漏れ など、ファイアウォールに直接関係する原因のみを出力する
    - 親要因が経路・通信系なら経路・ルーティングの原因を、性能・リソース系なら
      リソース・キャパシティの原因を、それぞれ同じ系統で深掘りする

    分析コンテキストに別系統の構成要素（DNS・認証基盤・ファイアウォール等）が複数登場しても、
    現在の親要因と異なる系統の要素を子要因に持ち込んではいけない。
    別系統の要因が重要だと考える場合でも、それは「現在の親要因の子」ではなく「頂上事象の別の一次要因」
    として扱うべきものなので、ここでは出力しない。

    【系統が混ざった悪い例（親子関係が不自然・必ず避けること）】
    親要因「DNS設定の誤り」（DNS系）に対して:
    ✗ 認証基盤の負荷状況確認不足
      → 認証基盤系。DNS設定の誤りの直接原因ではない。別系統なので子要因にしない
    ✗ ファイアウォールルールの適用範囲確認不足
      → ファイアウォール系。DNS設定の誤りの直接原因ではない。別系統なので子要因にしない

    親要因「認証基盤の負荷状況」（認証基盤系）に対して:
    ✗ DNS設定の更新遅延
      → DNS系。認証基盤の負荷の直接原因ではない。別系統なので子要因にしない

    親要因「DNS設定の誤り」（DNS系）の良い子要因:
    ✓ DNS設定値の入力誤り
    ✓ 配布用DNS設定テンプレートの誤り
    ✓ DNS設定反映時の確認漏れ
    ✓ DNSサーバ指定先の誤設定

    【検討の観点（バランスよく考慮すること）】
    親要因の直接原因を検討する際は、以下の観点を幅広く考慮する。
    ただし、各カテゴリを機械的に埋めるのではなく、「子要因Xが発生したため、親要因Yが発生した」と
    自然に説明できる候補だけを出力すること。

    - 技術系: 設定不備・冗長化設定・フェイルオーバー条件・ヘルスチェック・経路制御・
              切替トリガー・機器の待機状態・認証・名前解決・ポリシー・バージョン不整合
    - 運用系: 手順不備・確認漏れ・担当者不明確・記録不足・エスカレーション不足
    - 判断系: 復旧判定基準の不明確・稼働状態の誤認・切替条件の誤判断

    【親要因タイプ別の子要因生成ルール（内部分類・JSONに出力しない）】
    子要因を生成する前に、親要因を以下のいずれかとして内部的に分類し、
    そのタイプに合った直接原因だけを出力すること。

    ■ 親要因が技術系（例: フェイルオーバー条件の定義不足、経路制御設定の不備、ヘルスチェック誤り）
      → 設定項目の未定義、仕様理解不足、設計レビュー不足、設定反映漏れ、切替条件の誤設定 など
      → 単なる「確認漏れ」「手順不足」だけに寄せず、設定・仕様・設計・機器状態に分解する

    ■ 親要因が運用系（例: 稼働状況確認不足、確認手順の欠如、確認担当者の不明確化）
      → 確認手順の未整備、確認担当者の未設定、確認タイミングの未定義、チェックリスト未整備 など
      → 技術系要因（フェイルオーバー設定・経路制御等）は、運用系親要因の直接原因として
        自然に成立する場合だけ出力し、無理に含めない

    ■ 親要因が判断系（例: 稼働状態の誤認、復旧判定基準の不明確、切替条件の誤判断）
      → 判定基準の未定義、判断材料の不足、監視情報の確認漏れ、エスカレーション基準の未整備 など

    【悪い例（親子の因果関係が不正なパターン）】
    親要因「再起動後の対象サービス接続確認不足」に対して:
    ✗ 対象サービス接続確認の欠如
      → 親要因の言い換えに近い。親要因と同じ観点を語尾だけ変えた表現であり、深掘りになっていない

    親要因「確認担当者の割当漏れ」に対して:
    ✗ 対象機器の稼働状況確認漏れ
      → 確認担当者が割り当てられなかった「結果」として確認漏れが起きる関係。因果の向きが逆
    ✗ 対象サービス接続確認手順の未実施
      → 担当者割当漏れの「結果」に近く、直接原因ではない

    親要因「対象サービス接続状況の監視不足」に対して:
    ✗ 対象サービス接続状況の定期確認不足
      → 親要因の言い換えに近い。監視不足と定期確認不足はほぼ同義

    【良い例（親要因の直接原因として適切なパターン）】
    親要因「再起動後の対象サービス接続確認不足」の良い子要因:
    ✓ 再起動後確認手順の未整備
    ✓ 確認担当者の割当漏れ
    ✓ 接続確認項目の未定義
    ✓ 確認結果記録の未取得
    ✓ 復旧判定基準の未定義

    親要因「監視アラートの確認遅延」の良い子要因:
    ✓ アラート通知先の設定漏れ
    ✓ 通知メールの見落とし
    ✓ 監視画面確認手順の未実施
    ✓ アラート確認担当の不明確化
    ✓ アラート重要度分類の誤設定

    親要因「対象機器の稼働状況確認漏れ」の良い子要因:
    ✓ 稼働確認手順の未整備
    ✓ 確認対象機器の一覧未更新
    ✓ 確認結果の記録ルール未定義
    ✓ 確認タイミングの未設定
    ✓ 確認担当者への作業指示漏れ

    親要因「対象機器が自動切替しなかった」の良い子要因（技術系）:
    ✓ フェイルオーバー条件の設定誤り
    ✓ ヘルスチェック失敗時の切替トリガー未設定
    ✓ 切替先機器の待機状態異常
    ✓ 経路優先度設定の不整合
    ✓ 冗長化ペア設定の不一致

    親要因「切替先経路に通信が流れなかった」の良い子要因（技術系）:
    ✓ ルーティング設定の不整合
    ✓ 切替先インターフェースの無効化
    ✓ ファイアウォールポリシーの未反映
    ✓ 名前解決先の更新漏れ
    ✓ 経路広報設定の不足

    【子要因の品質要件】
    - 現場で「はい/いいえ」で確認できる粒度にする
    - 親要因と同じ名前・語尾だけを変えた名前は禁止
    - 同じ意味の要因を複数出すことは禁止
    - 「原因」「要因」「問題」「不備」「その他」だけの名前・単語1語の抽象名は禁止
    - nameは30文字以内、descriptionは確認観点を80文字以内で記述する
    - descriptionは要因の「状態定義」として書く
      良い例: 「対象機器の稼働状態を確認する手順が標準作業として定義されていない状態。」
      避ける例: 「手順が定義されていなかったため、障害発生時に迅速な対応ができなかった。」（原因→結果文）
    - confidence: "high"=直接原因の可能性が高い / "medium"=可能性あり / "low"=念のため確認

    【参考観点（必要なものだけ使うこと）】
    構成・設定 / ソフトウェア・バージョン / ハードウェア・リソース / ネットワーク・通信経路
    認証・権限 / 名前解決 / 外部サービス・依存 / 監視・検知
    運用手順・変更管理 / 復旧対応・判断 / ログ・調査 / キャパシティ・性能
    冗長化・切替 / セキュリティ設定 / 証明書・期限管理

    【出力前の内部確認（チェックのみ、JSONに含めない）】
    各候補について出力前に確認すること:
    ①「この子要因が発生したため、親要因が発生した」と言えるか
    ②親要因の言い換えになっていないか
    ③親要因の結果・影響を出していないか
    ④祖先要因一覧に戻っていないか
    ⑤現場でYes/No確認できる粒度か

    【出力形式（必ず守ること）】
    JSONオブジェクトのみ出力する（前置き・補足・説明文・Markdown禁止）

    {"factors": [
      {"name": "設定変更の反映漏れ", "description": "直近の設定変更が全ノードに反映されているか変更履歴で確認する", "confidence": "high"},
      {"name": "冗長構成の切替失敗", "description": "フェイルオーバー発生時に切替が正常に完了したかログで確認する", "confidence": "medium"}
    ]}
