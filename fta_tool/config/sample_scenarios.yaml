# FTA デモ用サンプルシナリオ設定ファイル
#
# 新規分析画面で「サンプルを利用する」を選択した場合に表示・利用される。
# 各シナリオは以下の項目を持つ:
#   id               - 一意なID（英数字・アンダースコア）
#   category         - 画面表示用のカテゴリ
#   title            - 画面表示用のタイトル
#   top_event        - 頂上事象（入力欄に反映される）
#   system_context   - システム構成の説明（分析コンテキストとして保存・プロンプトに利用）
#   incident_context - 障害発生時の状況（分析コンテキストとして保存・プロンプトに利用）
#   demo_points       - デモ観点（分析コンテキストとして保存・プロンプトに利用）
#
# 会社名・顧客名・実在拠点名・実在製品名・実障害名には依存しない一般的な
# 表現で記述すること。

scenarios:
  - id: internet_web_access_failure
    category: インターネット接続構成
    title: インターネット公開Webシステムにアクセスできない
    top_event: 社外利用者がインターネット経由で公開Web申請システムにアクセスできない
    system_context: |
      本システムは、社外利用者がインターネット経由で利用するWeb申請システムである。
      利用者端末、インターネット、外部DNS、ファイアウォール、ロードバランサ、DMZ上のWebサーバ、
      内部ネットワーク上のアプリケーションサーバ、データベースサーバで構成される。
      WebサーバはDMZに配置され、アプリケーションサーバとデータベースサーバは内部ネットワークに
      配置されている。ロードバランサは複数台のWebサーバに通信を振り分ける。
    incident_context: |
      複数の社外利用者から、Web申請システムにアクセスできないとの連絡があった。
      ブラウザではタイムアウトする。一部の利用者では名前解決は成功している。
      社内ネットワークからの管理画面アクセスは可能である。
      直近でファイアウォール設定変更と証明書更新作業が実施されている。
    demo_points: |
      DNS、ファイアウォール、ロードバランサ、Webサーバ、証明書、外部回線、設定変更作業などの
      観点からFTA要因を生成しやすいデモ用シナリオ。

  - id: vpn_internal_system_access_failure
    category: リモートアクセス
    title: VPN接続後に社内システムへ接続できない
    top_event: 在宅勤務者がVPN接続後に社内業務システムへ接続できない
    system_context: |
      本システムは、在宅勤務者がインターネット経由でVPN接続し、社内業務システムを利用する
      構成である。利用者端末、インターネット、VPN装置、認証基盤、社内DNS、ファイアウォール、
      業務アプリケーションサーバで構成される。
      VPN接続後、利用者端末には社内向け経路とDNS設定が配布される。
    incident_context: |
      複数の在宅勤務者から、VPN接続後に社内業務システムへ接続できないとの連絡があった。
      VPN接続自体は成功している利用者がいる。一部利用者では社内DNS名の名前解決に失敗している。
      直近でVPN設定変更または認証設定変更が実施されている。
    demo_points: |
      VPN、認証、DNS、経路制御、ファイアウォール、端末設定などの観点からFTA要因を生成しやすい
      デモ用シナリオ。

  - id: file_server_share_access_failure
    category: ファイルサーバ
    title: 部門共有フォルダにアクセスできない
    top_event: 利用者が社内ネットワーク上の部門共有フォルダにアクセスできない
    system_context: |
      本システムは、社内LAN上の利用者端末から、認証基盤と連携したファイルサーバ上の
      部門共有フォルダを利用する構成である。利用者端末、社内LAN、認証基盤、ファイルサーバ、
      共有フォルダ、アクセス権設定、名前解決で構成される。
      共有フォルダへのアクセスは、ユーザーまたはグループ単位の権限により制御される。
    incident_context: |
      複数の利用者が部門共有フォルダにアクセスできない。一部の利用者はアクセス可能である。
      エラー内容は、権限不足またはパスが見つからない内容である。
      直近で部門異動やアクセス権変更があった。
    demo_points: |
      アクセス権、認証、グループ設定、ファイルサーバ、名前解決、端末設定などの観点から
      FTA要因を生成しやすいデモ用シナリオ。

  - id: business_app_login_failure
    category: 認証
    title: 業務アプリにログインできない
    top_event: 利用者が社内ポータルから業務アプリにログインしようとすると認証エラーになる
    system_context: |
      本システムは、社内ポータルから業務アプリケーションへログインする構成である。
      利用者端末、社内ポータル、認証基盤、ID管理システム、業務アプリケーション、権限管理で
      構成される。
      ログイン時には認証基盤と業務アプリケーション間で認証情報や属性情報が連携される。
    incident_context: |
      複数利用者でログインエラーが発生している。一部の既存ログイン済みユーザーは利用を
      継続できている。新規ログイン時にエラーが発生する。
      直近で認証連携設定または証明書更新が行われた。
    demo_points: |
      認証基盤、ID管理、権限、証明書、認証連携設定、セッション管理などの観点からFTA要因を
      生成しやすいデモ用シナリオ。

  - id: batch_job_abnormal_end
    category: バッチ処理
    title: 夜間バッチ処理が異常終了した
    top_event: 夜間のデータ連携バッチが異常終了し、翌朝の帳票が作成されない
    system_context: |
      本システムは、ジョブスケジューラにより夜間バッチを実行し、外部または内部の連携先
      システムからデータを取得して帳票を作成する構成である。
      ジョブスケジューラ、バッチサーバ、データ連携先システム、データベース、ファイル転送領域、
      帳票作成処理で構成される。複数のジョブが依存関係を持って順番に実行される。
    incident_context: |
      夜間バッチが途中で異常終了した。後続ジョブが実行されていない。
      翌朝の帳票が作成されていない。エラーログには接続失敗またはファイル未検出の記録がある。
      直近で連携先システムのメンテナンスまたはファイル配置変更があった。
    demo_points: |
      スケジューラ、ジョブ依存関係、接続先、ファイル配置、権限、データ形式、リソース不足などの
      観点からFTA要因を生成しやすいデモ用シナリオ。

  - id: cloud_api_integration_failure
    category: クラウド・SaaS連携
    title: 外部クラウドサービスとのAPI連携が失敗する
    top_event: 社内システムから外部クラウドサービスへのAPI連携が失敗する
    system_context: |
      本システムは、社内アプリケーションサーバからプロキシとファイアウォールを経由して、
      インターネット上の外部クラウドサービスAPIへ接続する構成である。
      社内アプリケーションサーバ、プロキシ、ファイアウォール、インターネット、
      外部クラウドサービスAPI、API認証情報、証明書で構成される。
      API連携では認証情報、通信経路、証明書、外部サービス側の状態が影響する。
    incident_context: |
      API連携処理が失敗している。エラーログには認証エラーまたはタイムアウトが記録されている。
      ブラウザから外部サービスの管理画面にはアクセスできる。
      直近でAPIキー更新、証明書更新、プロキシ設定変更のいずれかがあった。
    demo_points: |
      API認証、証明書、プロキシ、ファイアウォール、外部サービス状態、タイムアウト、設定変更作業
      などの観点からFTA要因を生成しやすいデモ用シナリオ。
