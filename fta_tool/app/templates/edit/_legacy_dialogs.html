{#- Legacy dialogs, moved as they were (plan 7.2 PR-3: detail editing, manual
    add and generation still use the old processing). app.js drives them;
    PR-5 replaces the detail modal and the manual-add modal, PR-6 the
    generation overlay (J-05). -#}

<!-- Node Detail Modal -->
<div id="nodeDetailModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="nodeDetailModalTitle">
  <div class="modal-backdrop" onclick="closeNodeDetail()"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="nodeDetailModalTitle">ノード詳細編集</h2>
      <button class="modal-close" onclick="closeNodeDetail()" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalNodeId">
      <div id="modalWarningRow" class="modal-warning-row" hidden>
        <span class="warning-badge">要確認</span>
        <span id="modalWarningText"></span>
      </div>
      <div class="form-group">
        <label for="modalTitle">要因タイトル <span class="required">*</span></label>
        <input type="text" id="modalTitle" class="form-input">
      </div>
      <div class="form-group">
        <label for="modalDescription">説明</label>
        <textarea id="modalDescription" rows="3" class="form-input"></textarea>
      </div>
      <div class="form-group">
        <label for="modalMemo">メモ</label>
        <textarea id="modalMemo" rows="2" class="form-input"></textarea>
      </div>
      <hr>
      <h3>直接要因評価</h3>
      <div class="form-group">
        <label for="modalDirectStatus">ステータス</label>
        <select id="modalDirectStatus" class="form-input">
          <option value="unknown">未評価</option>
          <option value="likely">直接要因の可能性が高い</option>
          <option value="unlikely">直接要因の可能性が低い</option>
          <option value="direct">直接要因</option>
          <option value="not_direct">直接要因でない</option>
        </select>
      </div>
      <div class="form-group">
        <label for="modalDirectComment">評価コメント</label>
        <textarea id="modalDirectComment" rows="2" class="form-input"></textarea>
      </div>
      <div class="form-group">
        <label for="modalEvidence">根拠</label>
        <textarea id="modalEvidence" rows="2" class="form-input"></textarea>
      </div>
      <div class="form-group">
        <label for="modalPrevention">再発防止策の候補</label>
        <textarea id="modalPrevention" rows="2" class="form-input"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeNodeDetail()">キャンセル</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveNodeDetail()">保存</button>
    </div>
  </div>
</div>

<!-- Add Node Modal -->
<div id="addNodeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addNodeModalTitle">
  <div class="modal-backdrop" onclick="closeAddNodeModal()"></div>
  <div class="modal-content modal-sm">
    <div class="modal-header">
      <h2 id="addNodeModalTitle">要因を手動追加</h2>
      <button class="modal-close" onclick="closeAddNodeModal()" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="addNodeAnalysisId">
      <input type="hidden" id="addNodeParentId">
      <input type="hidden" id="addNodeLevel">
      <div class="form-group">
        <label for="addNodeTitle">要因タイトル <span class="required">*</span></label>
        <input type="text" id="addNodeTitle" class="form-input" placeholder="要因のタイトルを入力">
      </div>
      <div class="form-group">
        <label for="addNodeDescription">説明</label>
        <textarea id="addNodeDescription" rows="2" class="form-input" placeholder="説明（任意）"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeAddNodeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitAddNode()">追加</button>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div id="loadingOverlay" class="loading-overlay hidden">
  <div class="loading-spinner"></div>
  <p>AIが要因を生成中...</p>
</div>
